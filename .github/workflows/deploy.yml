name: Déployer sur Cloudflare

# À chaque push sur main : build Next.js + OpenNext, puis déploiement
# du Worker « my-chicken » sur Cloudflare (workers.dev).
on:
  push:
    branches: [main]
  workflow_dispatch: # déclenchement manuel possible depuis l'onglet Actions

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire (Next.js + OpenNext pour Cloudflare)
        run: npx opennextjs-cloudflare build

      - name: Déployer le Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b411478365a56bb9c91f6a0bae54b29f
          wranglerVersion: '4'
          command: deploy
